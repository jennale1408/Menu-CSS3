<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Sản Phẩm</title>
   
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <nav class="navbar">
        <ul class="menu">
            <li><a href="#" class="active">Trang chủ</a></li>
            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Dự án</a></li>
            <li><a href="#">Sản phẩm</a></li>
            <li><a href="#">Dịch vụ</a></li>
            <li><a href="#">Tin tức</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </nav>

    <main class="container">
        <h2>Danh Sách Sản Phẩm</h2>

        <div class="product-list">
         
            <div class="product-card">
                <img src="https://via.placeholder.com/150" alt="Sản phẩm A">
                <h3 class="product-title">Sản phẩm A</h3>
                <p class="product-price">150.000đ</p>
                <button class="btn-buy">Mua ngay</button>
            </div>

     
            <div class="product-card">
                <img src="https://via.placeholder.com/150" alt="Sản phẩm B">
                <h3 class="product-title">Sản phẩm B</h3>
                <p class="product-price">200.000đ</p>
                <button class="btn-buy">Mua ngay</button>
            </div>


            <div class="product-card">
                <img src="https://via.placeholder.com/150" alt="Sản phẩm C">
                <h3 class="product-title">Sản phẩm C</h3>
                <p class="product-price">180.000đ</p>
                <button class="btn-buy">Mua ngay</button>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/150" alt="Sản phẩm D">
                <h3 class="product-title">Sản phẩm D</h3>
            </div>
    </main>

</body>
</html>
